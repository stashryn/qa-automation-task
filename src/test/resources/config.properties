# Every value can be overridden with -Dkey=value or an env variable (ui.headless -> UI_HEADLESS)

ui.base.url=https://www.saucedemo.com
ui.username=standard_user
ui.password=secret_sauce
ui.headless=true
ui.timeout.ms=8000

# only set in Docker, locally Selenium finds Chrome and the driver on its own
browser.binary=
chromedriver.path=
